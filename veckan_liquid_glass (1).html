<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Vilken vecka är det? – Se aktuellt veckonummer | Veckan</title>
<meta name="description" content="Se vilket veckonummer det är just nu. En enkel och gratis sida med aktuellt veckonummer och datumintervall.">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:locale" content="sv_SE">
<meta property="og:title" content="Vilken vecka är det? | Veckan">
<meta property="og:description" content="Se aktuellt veckonummer och datumintervallet för veckan, helt gratis.">
<meta name="application-name" content="Veckan">
<style>
  :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #f8fafc; overflow-x: hidden;
    background:
      radial-gradient(ellipse at 18% 12%, rgba(90,120,255,.48), transparent 34%),
      radial-gradient(ellipse at 85% 24%, rgba(36,210,190,.24), transparent 32%),
      radial-gradient(ellipse at 50% 100%, rgba(155,90,255,.30), transparent 38%),
      linear-gradient(145deg, #080d1b, #17233c 55%, #101827);
    display: grid; place-items: center; padding: 28px 16px;
  }
  .glow { position: fixed; width: 260px; height: 260px; border-radius: 50%; filter: blur(65px); opacity: .38; pointer-events:none; }
  .g1 { background:#4d75ff; top:8%; left:-90px; }
  .g2 { background:#25d6c0; right:-110px; bottom:10%; }
  main { width:min(100%, 620px); position:relative; z-index:1; }
  .top { display:flex; justify-content:space-between; align-items:center; margin:0 4px 18px; color:#dbeafe; }
  .brand { font-size:13px; letter-spacing:.22em; font-weight:700; text-transform:uppercase; opacity:.85; }
  .year { font-size:14px; opacity:.7; }
  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,.17), rgba(255,255,255,.055));
    border:1px solid rgba(255,255,255,.23);
    box-shadow: 0 24px 80px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.2);
    backdrop-filter: blur(24px) saturate(155%); -webkit-backdrop-filter: blur(24px) saturate(155%);
    border-radius:30px;
  }
  .hero { padding:34px 28px 28px; text-align:center; overflow:hidden; position:relative; }
  .hero:before { content:""; position:absolute; width:340px; height:180px; left:50%; top:-135px; transform:translateX(-50%); background:rgba(255,255,255,.2); filter:blur(42px); border-radius:50%; }
  .eyebrow { margin:0; position:relative; font-size:12px; letter-spacing:.24em; color:#dbeafe; opacity:.78; font-weight:650; }
  .week { position:relative; font-size:clamp(82px, 18vw, 142px); line-height:1; letter-spacing:.025em; font-weight:720; margin:12px 0 2px; text-shadow:0 8px 35px rgba(120,170,255,.2); }
  .week-label { position:relative; font-size:20px; color:#e2e8f0; }
  .date-range { position:relative; margin-top:15px; color:#cbd5e1; font-size:14px; }
  .pill { display:inline-flex; align-items:center; gap:8px; margin-top:22px; padding:9px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.09); font-size:12px; color:#eaf2ff; }
  .dot { width:7px; height:7px; border-radius:50%; background:#70f0bd; box-shadow:0 0 12px #70f0bd; }
  .foot { text-align:center; color:#aebbd0; font-size:12px; margin:16px 0 0; }
  @media(max-width:480px) { .hero{padding:34px 18px 30px} }
  @media(prefers-reduced-motion:no-preference) { .glass { animation: rise .65s ease both; } @keyframes rise { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} } }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<main>
  <div class="top"><div class="brand">VECKAN</div><div class="year" id="topYear"></div></div>
  <section class="glass hero">
    <h1 class="eyebrow">JUST NU ÄR DET</h1>
    <div class="week" id="weekNumber">—</div>
    <div class="week-label">VECKA</div>
    <div class="date-range" id="range"></div>
    <div class="pill"><span class="dot"></span><span id="status">Aktuell vecka</span></div>
  </section>
  <div class="foot">Veckonummer enligt svensk standard · Veckan börjar på måndag.</div>
</main>
<script>
let now = new Date();
function isoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
function fmt(d) { return d.toLocaleDateString('sv-SE',{day:'numeric',month:'long'}); }
function render() {
  const week = isoWeek(now);
  document.getElementById('weekNumber').textContent = week;
  document.getElementById('topYear').textContent = now.getFullYear();
  const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay()+6)%7));
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  document.getElementById('range').textContent = `${fmt(monday)} – ${fmt(sunday)}`;
  document.getElementById('status').textContent = `Aktuell vecka · ${now.toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'})}`;
}
render();
// Håll veckonummer, datum och dagens markering uppdaterade medan sidan är öppen.
setInterval(() => {
  const latest = new Date();
  if (latest.toDateString() !== now.toDateString()) {
    now = latest;
    render();
  }
}, 30000);
window.addEventListener('focus', () => {
  now = new Date();
  render();
});
</script>
</body>
</html>
